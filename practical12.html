<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Webpage</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
footer{
    background:#212529;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
.card img{
    height:200px;
    object-fit:cover;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="#">MyWebsite</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
<li class="nav-item"><a class="nav-link" href="#">About</a></li>
<li class="nav-item"><a class="nav-link" href="#">Services</a></li>
<li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
</ul>
</div>
</div>
</nav>

<!-- Carousel -->
<div id="slider" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://via.placeholder.com/1200x400?text=Welcome+to+Website" class="d-block w-100" alt="slide1">
</div>

<div class="carousel-item">
<img src="https://via.placeholder.com/1200x400?text=Bootstrap+Design" class="d-block w-100" alt="slide2">
</div>

<div class="carousel-item">
<img src="https://via.placeholder.com/1200x400?text=Responsive+Layout" class="d-block w-100" alt="slide3">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#slider" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#slider" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>
</div>

<!-- Cards with Grid -->
<div class="container mt-5">
<h2 class="text-center mb-4">Our Services</h2>

<div class="row g-4">

<div class="col-md-4">
<div class="card shadow">
<img src="https://via.placeholder.com/350x200" class="card-img-top" alt="">
<div class="card-body text-center">
<h5 class="card-title">Web Design</h5>
<p class="card-text">Creative and modern website designs.</p>
<a href="#" class="btn btn-primary">Read More</a>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow">
<img src="https://via.placeholder.com/350x200" class="card-img-top" alt="">
<div class="card-body text-center">
<h5 class="card-title">Development</h5>
<p class="card-text">Fast and responsive web development.</p>
<a href="#" class="btn btn-success">Read More</a>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow">
<img src="https://via.placeholder.com/350x200" class="card-img-top" alt="">
<div class="card-body text-center">
<h5 class="card-title">Support</h5>
<p class="card-text">24/7 technical support services.</p>
<a href="#" class="btn btn-danger">Read More</a>
</div>
</div>
</div>

</div>
</div>

<!-- Footer -->
<footer>
<p>© 2026 MyWebsite | Designed with Bootstrap</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
